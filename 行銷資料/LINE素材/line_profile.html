<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:640px;height:640px;overflow:hidden;background:#000;}
.wrap{
  width:640px;height:640px;
  background:radial-gradient(135deg at 30% 30%,#1a0a00 0%,#0a0814 45%,#050410 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
/* star dots */
.star{position:absolute;border-radius:50%;background:white;}
/* outer glow ring */
.ring{
  position:absolute;border-radius:50%;border:2px solid rgba(212,175,55,0.3);
  top:50%;left:50%;transform:translate(-50%,-50%);
}
/* taichi gold circle */
.taichi-bg{
  width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff8e0,#d4af37 50%,#8a5a00);
  box-shadow:0 0 60px rgba(212,175,55,0.6), 0 0 120px rgba(212,175,55,0.2);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  position:relative;z-index:2;
}
.brand-zh{
  font-family:'DroidSansFallback',sans-serif;
  font-size:38px;font-weight:900;
  color:#1a0800;letter-spacing:2px;
  text-shadow:0 1px 3px rgba(255,255,255,0.3);
  line-height:1.2;text-align:center;
}
.brand-en{
  font-family:Georgia,serif;
  font-size:11px;font-weight:700;letter-spacing:3px;
  color:rgba(26,8,0,0.7);margin-top:4px;text-transform:uppercase;
}
.inner-ring{
  position:absolute;width:270px;height:270px;border-radius:50%;
  border:3px solid rgba(212,175,55,0.8);
  top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
}
.inner-ring2{
  position:absolute;width:290px;height:290px;border-radius:50%;
  border:1px solid rgba(212,175,55,0.35);
  top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;
}
.inner-ring3{
  position:absolute;width:320px;height:320px;border-radius:50%;
  border:1px solid rgba(212,175,55,0.15);
  top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;
}
</style>
</head>
<body>
<div class="wrap">
  <!-- Stars -->
  <div class="star" style="width:2px;height:2px;top:8%;left:15%;opacity:.7"></div>
  <div class="star" style="width:1px;height:1px;top:12%;left:72%;opacity:.5"></div>
  <div class="star" style="width:2px;height:2px;top:22%;left:88%;opacity:.6"></div>
  <div class="star" style="width:1px;height:1px;top:78%;left:10%;opacity:.6"></div>
  <div class="star" style="width:2px;height:2px;top:85%;left:80%;opacity:.5"></div>
  <div class="star" style="width:1px;height:1px;top:45%;left:5%;opacity:.4"></div>
  <div class="star" style="width:1px;height:1px;top:65%;left:92%;opacity:.5"></div>
  <div class="star" style="width:2px;height:2px;top:30%;left:20%;opacity:.4"></div>
  <div class="star" style="width:1px;height:1px;top:55%;left:78%;opacity:.6"></div>

  <!-- Rings -->
  <div class="inner-ring3"></div>
  <div class="inner-ring2"></div>

  <!-- Main circle -->
  <div class="taichi-bg">
    <div class="brand-zh">金牌<br>一條根</div>
    <div class="brand-en">Gold Medal Herbal</div>
  </div>

  <!-- Border ring -->
  <div class="inner-ring"></div>
</div>
</body>
</html>
